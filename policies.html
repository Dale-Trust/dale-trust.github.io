<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Policies | Dale Supporters Trust</title>
<meta name="description" content="The Dale Supporters Trust's policies — coach travel, code of conduct, privacy and data protection.">
<link rel="canonical" href="https://daletrust.uk/policies.html">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--royal:#0057A7;--bright:#1173D4;--navy:#0E1F3D;--ink:#10203A;--body:#46536B;--wash:#F2F5F9;--line:#DCE3EC;--green:#1E8E5A}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Montserrat',system-ui,sans-serif;color:var(--body);font-size:15.5px;line-height:1.7;background:#fff}
  h1,h2,h3{font-family:'Oswald';text-transform:uppercase;color:var(--ink);line-height:1.15}
  a{color:var(--royal)}
  .hero{background:linear-gradient(120deg,var(--navy),#16305C 58%,#00417E);color:#fff;padding:44px 24px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;top:0;bottom:0;right:-12%;width:42%;background:var(--royal);transform:skewX(-14deg);opacity:.35}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px}
  .hero .wrap{position:relative}
  .kicker{font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#8FC1FF;margin-bottom:8px}
  .hero h1{color:#fff;font-size:clamp(28px,5vw,44px)}
  .hero p{color:#C7D6EC;margin-top:10px;max-width:60ch}
  .back{display:inline-block;margin-top:12px;font:600 13px 'Oswald';text-transform:uppercase;letter-spacing:.07em;color:#8FC1FF;text-decoration:none}
  section{padding:40px 0 60px}
  .p{border:1px solid var(--line);border-left:5px solid var(--royal);border-radius:0 12px 12px 0;padding:20px 22px;margin-bottom:14px;background:#fff}
  .p h2{font-size:21px}
  .p p{font-size:14.5px;margin-top:5px}
  .meta{font-size:12.5px;color:#7A8AA5;margin-top:10px}
  .p a.go{display:inline-block;margin-top:12px;font:600 13px 'Oswald';text-transform:uppercase;letter-spacing:.06em;color:var(--royal);text-decoration:none}
  article h2{font-size:26px;margin-bottom:6px}
  article .stamp{font-size:13.5px;color:#7A8AA5;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  article .body p{margin-bottom:14px}
  article .body h3{font-size:18px;margin:24px 0 8px;text-transform:none;font-family:'Oswald'}
  article .body ul{margin:0 0 14px 22px}
  article .body li{margin-bottom:6px}
  .doc{background:var(--wash);border-left:4px solid var(--royal);border-radius:0 9px 9px 0;padding:14px 16px;margin:20px 0;font-size:14.5px}
  footer{background:var(--navy);color:#8CA2C4;font-size:12.5px;text-align:center;padding:22px}
</style>
</head>
<body>
<div class="hero"><div class="wrap">
  <p class="kicker">Dale Supporters Trust</p>
  <h1 id="heroTitle">Our policies</h1>
  <p id="heroSub">How the Trust does things, written down. If anything here is unclear, tell us and we'll put it better.</p>
  <a class="back" href="index.html">&larr; Back to the Trust</a>
</div></div>
<section><div class="wrap" id="out">Loading&hellip;</div></section>
<footer>Dale Trust is the trading name of Rochdale Supporters Club Limited, a registered society (29690R).</footer>
<script>
const EP='https://join.daletrust.uk';
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

function render(body){
  return String(body||'').split(/\n{2,}/).map(b=>{
    b=b.trim(); if(!b) return '';
    if(b.startsWith('# ')) return '<h3>'+esc(b.slice(2))+'</h3>';
    if(b.split('\n').every(l=>l.trim().startsWith('- ')))
      return '<ul>'+b.split('\n').map(l=>'<li>'+inline(esc(l.trim().slice(2)))+'</li>').join('')+'</ul>';
    return '<p>'+inline(esc(b)).replace(/\n/g,'<br>')+'</p>';
  }).join('');
}
function inline(s){
  return s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

(async()=>{
  const slug=new URLSearchParams(location.search).get('p');
  try{
    if(slug){
      const d=await (await fetch(EP+'/policies?slug='+encodeURIComponent(slug))).json();
      if(!d.ok){$('out').innerHTML='<p>That one isn\'t published yet. <a href="policies.html">See the others</a>.</p>';return;}
      const p=d.policy;
      $('heroTitle').textContent=p.title;
      $('heroSub').textContent=p.summary||'';
      document.title=p.title+' | Dale Supporters Trust';
      $('out').innerHTML='<article>'+
        '<p class="stamp">'+
          (p.version?'Version '+esc(p.version)+' &middot; ':'')+
          (p.approved_at?'agreed '+new Date(p.approved_at).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'')+
          (p.approved_by?' by '+esc(p.approved_by):'')+
        '</p>'+
        '<div class="body">'+render(p.body)+'</div>'+
        (p.doc_url?'<div class="doc">The signed original is available as a document: <a href="'+esc(p.doc_url)+'">download it here</a>.</div>':'')+
        '<p style="margin-top:26px"><a href="policies.html">&larr; All policies</a></p></article>';
    } else {
      const d=await (await fetch(EP+'/policies')).json();
      if(!d.ok||!d.policies.length){$('out').innerHTML='<p>Nothing published yet.</p>';return;}
      $('out').innerHTML=d.policies.map(p=>
        '<div class="p"><h2>'+esc(p.title)+'</h2>'+
        (p.summary?'<p>'+esc(p.summary)+'</p>':'')+
        '<p class="meta">'+(p.version?'Version '+esc(p.version):'')+
          (p.approved_at?(p.version?' &middot; ':'')+'agreed '+new Date(p.approved_at).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'')+'</p>'+
        '<a class="go" href="policies.html?p='+encodeURIComponent(p.slug)+'">Read it &rarr;</a></div>').join('');
    }
  }catch(e){$('out').textContent='Could not load just now.';}
})();
</script>
</body>
</html>
