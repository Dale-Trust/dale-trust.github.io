<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity | Dale Trust admin</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--royal:#0057A7;--navy:#0E1F3D;--ink:#10203A;--body:#46536B;--wash:#F2F5F9;--line:#DCE3EC;--green:#1E8E5A;--gold:#E8B84B;--red:#C0392B}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Montserrat',system-ui,sans-serif;background:var(--wash);color:var(--body);font-size:14.5px}
  h1,h2{font-family:'Oswald';text-transform:uppercase;color:var(--ink)}
  .back{background:#0A1730;padding:8px 20px;font-size:13px}
  .back a{color:#8FC1FF;text-decoration:none;font-weight:600}
  .top{background:var(--navy);color:#fff;padding:18px 22px}
  .top h1{font-size:21px}.top small{color:#8FC1FF;font-size:12.5px;display:block;margin-top:2px}
  .wrap{max-width:1000px;margin:0 auto;padding:18px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
  label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);margin:0 0 4px}
  input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font:inherit;color:var(--ink);background:#fff}
  .row{display:grid;grid-template-columns:1fr 240px auto;gap:10px;align-items:end;margin-bottom:14px}
  @media(max-width:700px){.row{grid-template-columns:1fr}}
  button{background:var(--royal);color:#fff;border:0;border-radius:9px;padding:11px 20px;font:600 13px 'Oswald';text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
  button.ghost{background:#fff;color:var(--body);border:1.5px solid var(--line)}
  .e{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
  .e:hover{background:#F7FAFF}
  .when{font-size:12.5px;color:#7A8AA5;flex:none;width:130px}
  .who{font-size:13px;color:var(--ink);font-weight:600;flex:none;width:170px;overflow:hidden;text-overflow:ellipsis}
  .what{flex:1;min-width:0;font-size:13.5px}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:100px;margin-right:8px;color:#fff}
  .t-member{background:var(--royal)}.t-post{background:#5B6472}.t-mail{background:var(--gold);color:#3a2c00}
  .t-coach{background:#0F7A6B}.t-survey{background:#7A4FBF}.t-danger{background:var(--red)}.t-other{background:#8C9299}
  .det{color:#5A6880}
  .pager{display:flex;gap:10px;align-items:center;margin-top:14px}
  .count{font-size:13.5px;font-weight:600;margin-bottom:10px}
  @media(max-width:700px){.e{flex-wrap:wrap}.when,.who{width:auto}}
</style>
</head>
<body>
<div class="back"><a href="admin.html">&larr; Back to admin</a></div>
<div class="top"><h1>Activity</h1><small>Everything officers have done, newest first</small></div>
<div class="wrap"><div class="panel">
  <div class="row">
    <div><label>Search</label><input id="q" placeholder="a name, a member number, anything" onkeydown="if(event.key==='Enter')load(0)"></div>
    <div><label>Who</label><select id="who" onchange="load(0)"><option value="">Everyone</option></select></div>
    <div><button onclick="load(0)">Search</button></div>
  </div>
  <p class="count" id="count"></p>
  <div id="list">Loading…</div>
  <div class="pager">
    <button class="ghost" id="prev" onclick="load(offset-limit)">&larr; Newer</button>
    <button class="ghost" id="next" onclick="load(offset+limit)">Older &rarr;</button>
    <span id="range" style="font-size:13px;color:#7A8AA5"></span>
  </div>
</div></div>
<script>
const EP='https://join.daletrust.uk';
const $=id=>document.getElementById(id);
let session=null; try{session=localStorage.getItem('dt_session');}catch(e){}
if(!session) location.href='admin.html';
const H=()=>({'Authorization':'Bearer '+session});
let offset=0, limit=80, total=0, loadedPeople=false;
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

const LABEL={'member.add':'Added a member','member.edit':'Edited a member','member.DELETE':'Deleted a member',
 'member.renew':'Renewed','post.create':'Wrote a post','post.update':'Edited a post','post.submit':'Sent a post for approval',
 'post.approved':'Approved a post','post.sent_back':'Sent a post back','post.DELETE':'Deleted a post','post.delete':'Deleted posts',
 'posts.import':'Imported articles','posts.rewrite':'Rewrote article links','mailshot':'Sent an email',
 'renewal.send':'Sent renewal notices','survey.save':'Saved a survey','survey.send':'Emailed a survey',
 'coach.trip.create':'Set up a coach','coach.trip.update':'Edited a coach','coach.manual':'Took a booking',
 'coach.paid':'Payment received','coach.live':'Put a coach on the website','coach.hidden':'Took a coach off the website',
 'awaytrust.save':'Updated a visiting trust','awaytrust.contacted':'Contacted a visiting trust',
 'task.respond':'Answered on the decisions list','task.status':'Changed a decision','settings.change':'Changed a setting',
 'season.rollover':'Rolled the season over','retention.anonymise':'Removed old personal data','help.request':'Asked for help'};

function tagFor(a){
  if(a.indexOf('DELETE')>-1||a.indexOf('delete')>-1||a.indexOf('rollover')>-1||a.indexOf('anonymise')>-1) return ['t-danger','careful'];
  if(a.startsWith('member')) return ['t-member','member'];
  if(a.startsWith('post')) return ['t-post','article'];
  if(a.startsWith('mail')||a.startsWith('renewal')) return ['t-mail','email'];
  if(a.startsWith('coach')) return ['t-coach','coach'];
  if(a.startsWith('survey')) return ['t-survey','survey'];
  return ['t-other','other'];
}

async function load(off){
  offset=Math.max(0,off||0);
  const q=encodeURIComponent($('q').value.trim()), who=encodeURIComponent($('who').value);
  try{
    const r=await fetch(EP+'/activity?q='+q+'&who='+who+'&limit='+limit+'&offset='+offset,{headers:H()});
    if(r.status===401||r.status===403){location.href='admin.html';return;}
    const d=await r.json();
    if(!d.ok){$('list').textContent=d.error;return;}
    total=d.total;
    if(!loadedPeople&&d.people){loadedPeople=true;
      $('who').innerHTML='<option value="">Everyone</option>'+d.people.map(p=>'<option>'+esc(p)+'</option>').join('');}
    $('count').innerHTML='<b>'+total+'</b> thing'+(total===1?'':'s')+' recorded';
    $('list').innerHTML=d.entries.map(e=>{
      const [cls,tag]=tagFor(e.action);
      const when=new Date(e.at.replace(' ','T')+'Z');
      return '<div class="e"><span class="when">'+when.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+
        ' '+when.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</span>'+
        '<span class="who">'+esc((e.officer||'').split('@')[0])+'</span>'+
        '<span class="what"><span class="tag '+cls+'">'+tag+'</span>'+
        esc(LABEL[e.action]||e.action)+
        (e.detail?' <span class="det">— '+esc(e.detail)+'</span>':'')+'</span></div>';
    }).join('') || '<p style="padding:14px 4px;color:#7A8AA5">Nothing found.</p>';
    $('prev').style.visibility=offset>0?'visible':'hidden';
    $('next').style.visibility=(offset+limit<total)?'visible':'hidden';
    $('range').textContent=total?('Showing '+(offset+1)+'–'+Math.min(offset+limit,total)+' of '+total):'';
  }catch(e){$('list').textContent='Could not reach the server.';}
}
load(0);
</script>
</body>
</html>
