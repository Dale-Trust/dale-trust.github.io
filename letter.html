<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your welcome letter | Dale Supporters Trust</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Montserrat:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>

  :root{--badge:#002F7C;--royal:#0057A7;--navy:#0E1F3D;--ink:#10203A;--body:#46536B;--wash:#F2F5F9;--line:#DCE3EC;--green:#1E8E5A;--gold:#E8B84B;--red:#C0392B}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Montserrat',system-ui,sans-serif;background:var(--wash);color:var(--body);font-size:14.5px}
  h1,h2{font-family:'Oswald';text-transform:uppercase;color:var(--ink)}
  .back{background:#0A1730;padding:8px 20px;font-size:13px}
  .back a{color:#8FC1FF;text-decoration:none;font-weight:600}
  .top{background:var(--navy);color:#fff;padding:18px 22px}
  .top h1{font-size:21px}.top small{color:#8FC1FF;font-size:12.5px;display:block;margin-top:2px}
  .wrap{max-width:1000px;margin:0 auto;padding:18px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .panel h2{font-size:16px;border-left:4px solid var(--royal);padding-left:10px;margin-bottom:12px}
  label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font:inherit;color:var(--ink);background:#fff}
  textarea{min-height:340px;line-height:1.65;font-size:13.5px;font-family:ui-monospace,Menlo,monospace}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:700px){.g2,.g3{grid-template-columns:1fr}}
  button{background:var(--royal);color:#fff;border:0;border-radius:9px;padding:11px 20px;font:600 13px 'Oswald';text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
  button.green{background:var(--green)}button.ghost{background:#fff;color:var(--body);border:1.5px solid var(--line)}
  .hint{font-size:12.5px;color:#7A8AA5;margin-top:5px}
  .tags code{background:var(--wash);border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:12.5px;margin-right:5px;display:inline-block;margin-bottom:5px}
  .msg{font-size:13.5px;font-weight:600;margin-top:10px}
  .count{background:var(--wash);border-left:4px solid var(--royal);border-radius:0 9px 9px 0;padding:12px 14px;margin-top:12px}
  .count b{font-family:'Oswald';font-size:24px;color:var(--ink)}

  /* ---------- membership cards, ten to a sheet ---------- */
  /* A4 210x297. Two 85mm cards + 10mm gap = 180mm, so 15mm each side.
     Five 55mm rows = 275mm, so 11mm top and bottom. */
  .cardsheet{width:210mm;height:297mm;background:#fff;margin:0 auto 18px;padding:11mm 15mm;
    display:grid;grid-template-columns:85mm 85mm;grid-template-rows:repeat(5,55mm);
    column-gap:10mm;row-gap:0;align-content:start;justify-content:center;
    box-shadow:0 10px 30px rgba(4,30,66,.14);page-break-after:always;box-sizing:border-box}
  .mcard{width:85mm;height:55mm;position:relative;overflow:hidden;color:#fff;
    background:linear-gradient(125deg,#002F7C 0%,#0057A7 62%,#00417E 100%);
    outline:0.2mm dashed rgba(0,0,0,.28);outline-offset:0}
  .mcard::before{content:"";position:absolute;top:0;bottom:0;right:-16%;width:46%;background:#1173D4;transform:skewX(-14deg);opacity:.34}
  .mc-in{position:relative;height:100%;padding:5mm 5.5mm;display:flex;flex-direction:column;justify-content:space-between}
  .mc-top{display:flex;align-items:center;gap:3mm}
  .mc-crest{width:11mm;height:11mm;border-radius:50%;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .mc-crest img{width:100%;height:100%;object-fit:contain}
  .mc-top b{font-family:'Oswald';text-transform:uppercase;font-size:8pt;letter-spacing:.06em;line-height:1.15;display:block}
  .mc-top span{font-size:5.4pt;letter-spacing:.16em;text-transform:uppercase;color:#BBD6F5;display:block;margin-top:0.4mm}
  .mc-name{font-family:'Oswald';text-transform:uppercase;font-size:14pt;line-height:1.05;letter-spacing:.01em}
  .mc-type{font-size:6.6pt;letter-spacing:.14em;text-transform:uppercase;color:#BBD6F5;margin-top:1mm}
  .mc-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:3mm}
  .mc-no{font-family:'Oswald';font-size:9pt;letter-spacing:.04em}
  .mc-no span{display:block;font-family:'Montserrat';font-size:5.4pt;letter-spacing:.14em;text-transform:uppercase;color:#BBD6F5;font-weight:600}
  .mc-qr{width:13mm;height:13mm;background:#fff;padding:0.6mm;flex:none}
  .mc-qr img{width:100%;height:100%;display:block}
  .mc-url{font-size:5.6pt;color:#C7D6EC;letter-spacing:.04em;text-align:right;line-height:1.3}
  @media print{
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important} .cardsheet{box-shadow:none;margin:0} }

  /* ---------- page two: the cut-out temporary card ---------- */
  .tempsheet{width:210mm;min-height:297mm;background:#fff;margin:0 auto 18px;padding:24mm 20mm;
    box-shadow:0 10px 30px rgba(4,30,66,.14);page-break-after:always;box-sizing:border-box}
  .tempsheet h3{font-family:'Oswald';text-transform:uppercase;color:var(--badge);font-size:16pt;margin:0 0 3mm}
  .tempsheet p{font-size:10pt;line-height:1.6;color:#1a1a1a;margin:0 0 3mm;max-width:150mm}
  .tempsheet .small{font-size:8.5pt;color:#666}
  .cut{margin:12mm 0 6mm;padding:8mm;border:0.4mm dashed #9AA7B8;display:inline-block;position:relative}
  .cut::after{content:"\2702  cut along the dotted line";position:absolute;top:-3.4mm;left:8mm;background:#fff;
    padding:0 2mm;font-size:7.5pt;color:#8595AA;letter-spacing:.04em}
  @media print{ .tempsheet{box-shadow:none;margin:0} }

  /* ---------- the letter itself ---------- */
  #sheets{display:none}
  .sheet{width:210mm;height:297mm;max-height:297mm;overflow:hidden;background:#fff;margin:0 auto 18px;padding:0;position:relative;
    box-shadow:0 10px 30px rgba(4,30,66,.14);page-break-after:always;display:flex;flex-direction:column}
  .sh-top{background:var(--badge);color:#fff;padding:11mm 18mm 9mm;position:relative;overflow:hidden}
  .sh-top::before{content:"";position:absolute;top:0;bottom:0;right:-14%;width:44%;background:var(--royal);transform:skewX(-14deg);opacity:.38}
  .sh-brand{position:relative;display:flex;align-items:center;gap:6mm}
  .sh-crest{width:18mm;height:18mm;border-radius:50%;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .sh-crest img{width:100%;height:100%;object-fit:contain}
  .sh-brand b{font-family:'Oswald';text-transform:uppercase;font-size:15pt;letter-spacing:.02em;display:block;line-height:1.05}
  .sh-brand span{font-size:7pt;color:#BBD6F5;display:block;margin-top:0.8mm;letter-spacing:.14em;text-transform:uppercase}
  .sh-body{padding:9mm 18mm 6mm;flex:1;font-size:9.8pt;line-height:1.5;color:#1a1a1a}
  .sh-body .date{text-align:right;color:#666;font-size:9pt;margin-bottom:4mm}
  .sh-body h2{font-family:'Oswald';text-transform:uppercase;color:var(--badge);font-size:14pt;margin:0 0 3mm;letter-spacing:.01em}
  .sh-body p{margin:0 0 2.8mm}
  .sh-body strong{color:var(--badge)}
  .sh-card{background:var(--wash);border-left:4px solid var(--royal);border-radius:0 3mm 3mm 0;padding:3mm 4mm;margin:4mm 0}
  .sh-card b{font-family:'Oswald';font-size:13pt;color:var(--ink);display:block;text-transform:uppercase}
  .sign{font-family:'Caveat',cursive;font-size:19pt;color:var(--badge);margin:4mm 0 0.5mm}
  .sh-foot{background:var(--navy);color:#8CA2C4;font-size:7pt;padding:4mm 18mm;line-height:1.45}
  .sh-foot .row{display:flex;justify-content:space-between;gap:6mm;color:#C7D6EC;font-size:7.5pt;margin-bottom:1.5mm}
  @media print{
    body{background:#fff}
    .back,.top,.wrap{display:none!important}
    #sheets{display:block!important}
    .sheet{box-shadow:none;margin:0;width:auto;min-height:auto}
    @page{size:A4;margin:0}
  }

  body{background:#EEF2F7}
  .bar{background:var(--navy);color:#fff;padding:16px 22px}
  .bar .in{max-width:210mm;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .bar b{font-family:'Oswald';text-transform:uppercase;font-size:17px;display:block}
  .bar em{font-style:normal;font-size:13px;color:#8FC1FF}
  .bar button{background:#fff;color:var(--navy)}
  .stage{padding:20px 12px 50px}
  #out{max-width:210mm;margin:0 auto}
  .note{max-width:210mm;margin:0 auto 14px;background:#fff;border-left:4px solid var(--royal);border-radius:0 10px 10px 0;padding:14px 18px;font-size:14.5px;color:var(--body)}
  @media print{ .bar,.note{display:none!important} .stage{padding:0} body{background:#fff} }
</style>
</head>
<body>
<div class="bar"><div class="in">
  <span><b>Your welcome letter</b><em id="who"></em></span>
  <button onclick="printWhenReady(document.getElementById('out'))">Print or save as PDF</button>
</div></div>
<div class="stage">
  <div class="note" id="note">Loading your letter&hellip;</div>
  <div id="out"></div>
</div>
<script>
const EP='https://join.daletrust.uk';
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
let tpl=null;

// wait for every image in a block to finish loading before printing,
// otherwise the print dialog opens while the crest and QR are still downloading
function printWhenReady(el){
  const imgs = Array.from(el.querySelectorAll('img'));
  const waits = imgs.map(i => (i.complete && i.naturalWidth)
    ? Promise.resolve()
    : new Promise(res => { i.addEventListener('load', res, {once:true});
                           i.addEventListener('error', res, {once:true});
                           setTimeout(res, 4000); }));
  Promise.all(waits).then(() => setTimeout(() => window.print(), 120));
}



function fill(text, m){
  const isJunior = m.membership_type === 'Junior';
  const isNew = String(m.new_or_renewal || '').toLowerCase().startsWith('n');
  const don = Number(m.donation) || 0;
  const flags = { junior: isJunior, new: isNew, renewal: !isNew, donation: don > 0 };

  // walk the text and keep or drop each block, rather than wrestling with escaping
  function block(s, key, on){
    const open = '{{#' + key + '}}', notOpen = '{{^' + key + '}}', close = '{{/' + key + '}}';
    let out = '', i = 0;
    while (i < s.length) {
      const a = s.indexOf(open, i), b = s.indexOf(notOpen, i);
      const first = (a === -1) ? b : (b === -1 ? a : Math.min(a, b));
      if (first === -1) { out += s.slice(i); break; }
      const isNeg = (first === b);
      out += s.slice(i, first);
      const startTag = isNeg ? notOpen : open;
      const bodyStart = first + startTag.length;
      const bodyEnd = s.indexOf(close, bodyStart);
      if (bodyEnd === -1) { out += s.slice(first); break; }
      const inner = s.slice(bodyStart, bodyEnd);
      const keep = isNeg ? !on : on;
      if (keep) out += inner;
      i = bodyEnd + close.length;
    }
    return out;
  }

  let s = text;
  Object.keys(flags).forEach(k => { s = block(s, k, flags[k]); });

  return s
    .split('{{first_name}}').join(m.first_name || '')
    .split('{{last_name}}').join(m.last_name || '')
    .split('{{member_no}}').join(m.member_no || '')
    .split('{{season}}').join(m.season || '')
    .split('{{type}}').join(m.membership_type || '')
    .split('{{donation}}').join('\u00a3' + don.toFixed(2))
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function render(text){
  return text.split(/\n{2,}/).map(b=>{
    b=b.trim(); if(!b) return '';
    if(b.startsWith('# ')) return '<h2>'+esc(b.slice(2))+'</h2>';
    return '<p>'+esc(b).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')+'</p>';
  }).join('');
}

function sheet(m){
  const when=new Date().toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  return '<div class="sheet">'+
    '<div class="sh-top"><div class="sh-brand">'+
      '<span class="sh-crest"><img src="img/brand/dale-logo.png" alt="" onerror="this.style.display=\'none\'"></span>'+
      '<span><b>Dale Supporters<br>Trust</b><span>Your club &middot; your trust &middot; your say</span></span>'+
    '</div></div>'+
    '<div class="sh-body"><p class="date">'+when+'</p>'+
      render(fill(tpl.body, m))+
      '<p class="sign">'+esc((tpl.signed_by||'').split(' ').map(w=>w[0]).join('')+(tpl.signed_by||'').split(' ').slice(-1)[0].slice(1))+'</p>'+
      '<p style="margin:0"><strong>'+esc(tpl.signed_by||'')+'</strong>'+(tpl.signed_role?' &middot; '+esc(tpl.signed_role):'')+'</p>'+
    '</div>'+
    '<div class="sh-foot">'+
      '<div class="row"><span>daletrust.uk</span><span>info@daletrust.uk</span><span>@daletrust</span></div>'+
      'Dale Trust is the trading name of Rochdale Supporters Club Limited, a registered society under the Co-operative and Community Benefit Societies Act 2014, registration 29690R. '+
      'Registered office: 22 West Crescent, Alkrington, Middleton, Manchester M24 4DA.'+
    '</div></div>';
}

function card(m){
  const qr='https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data='+
    encodeURIComponent('https://daletrust.uk/partners.html');
  return '<div class="mcard"><div class="mc-in">'+
    '<div class="mc-top">'+
      '<span class="mc-crest"><img src="img/brand/dale-logo.png" alt="" onerror="this.style.display=\'none\'"></span>'+
      '<span><b>Dale Supporters<br>Trust</b><span>Member '+esc(m.season)+'</span></span>'+
    '</div>'+
    '<div><div class="mc-name">'+esc(((m.first_name||'')+' '+(m.last_name||'')).trim())+'</div>'+
      '<div class="mc-type">'+esc(m.membership_type||'')+' member</div></div>'+
    '<div class="mc-bot">'+
      '<div class="mc-no">'+esc(m.member_no||'')+'<span>Membership number</span></div>'+
      '<div style="display:flex;align-items:flex-end;gap:2mm">'+
        '<div class="mc-url">Partners of the Trust<br>offer members a discount<br><b>daletrust.uk/partners</b></div>'+
        '<span class="mc-qr"><img src="'+qr+'" alt=""></span>'+
      '</div>'+
    '</div>'+
  '</div></div>';
}

function tempCardPage(m){
  return '<div class="tempsheet">'+
    '<h3>Your membership card</h3>'+
    '<p>Your printed card is on its way. In the meantime, here is a temporary one you can cut out and use straight away &mdash; '+
    'it works exactly the same at any of our Partners of the Trust.</p>'+
    '<div class="cut">'+card(m)+'</div>'+
    '<p class="small">Scan the code, or go to <b>daletrust.uk/partners</b>, for the full list of businesses offering members a discount. '+
    'The list is kept up to date there, so it is always current.</p>'+
    '<p class="small">You can also see your membership at <b>daletrust.uk</b> &mdash; your card, your details, coach travel and Player of the Month voting, '+
    'all in one place. No password needed; we send you a link.</p>'+
  '</div>';
}


(async()=>{
  const p=new URLSearchParams(location.search);
  const t=p.get('t')||'', ref=p.get('ref')||'';
  let session=null; try{session=localStorage.getItem('dt_member');}catch(e){}
  const headers = (!t && session) ? {'Authorization':'Bearer '+session} : {};
  try{
    const d=await (await fetch(EP+'/letter/mine?t='+encodeURIComponent(t)+'&ref='+encodeURIComponent(ref),{headers})).json();
    if(!d.ok){
      $('note').innerHTML='<b>'+esc(d.error)+'</b><br><a href="members.html">Sign in to your membership</a> and your letter will be there.';
      return;
    }
    tpl=d.template;
    const m=d.member;
    $('who').textContent=' \u00b7 '+m.first_name+' '+m.last_name+' \u00b7 '+m.member_no;
    $('note').innerHTML='This is your copy \u2014 <b>print it or save it as a PDF</b> with the button above. Page two has a temporary membership card you can cut out and use straight away.';
    $('out').innerHTML=sheet(m)+tempCardPage(m);
  }catch(e){
    $('note').textContent='Could not load your letter just now. Please try again shortly.';
  }
})();
</script>
</body>
</html>
