<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website — decisions and tasks | Dale Trust</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--royal:#0057A7;--navy:#0E1F3D;--ink:#10203A;--body:#46536B;--wash:#F2F5F9;--line:#DCE3EC;--green:#1E8E5A;--gold:#E8B84B}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Montserrat',system-ui,sans-serif;background:var(--wash);color:var(--body);font-size:15px}
  h1,h2{font-family:'Oswald';text-transform:uppercase;color:var(--ink)}
  .top{background:var(--navy);color:#fff;padding:20px 22px}
  .top h1{font-size:22px}
  .top small{color:#8FC1FF;font-size:13px;display:block;margin-top:3px}
  .wrap{max-width:900px;margin:0 auto;padding:18px}
  .bar{background:#fff;border:1px solid var(--line);border-left:5px solid var(--royal);border-radius:10px;padding:14px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .bar label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
  .bar select{padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font:inherit;color:var(--ink);background:#fff}
  .bar span{font-size:13.5px;color:#7A8AA5}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters button{background:#fff;border:1.5px solid var(--line);border-radius:100px;padding:8px 16px;font:600 13px 'Montserrat';color:var(--body);cursor:pointer}
  .filters button.on{background:var(--royal);border-color:var(--royal);color:#fff}
  h2.sec{font-size:16px;margin:24px 0 10px;border-left:4px solid var(--royal);padding-left:10px}
  .item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:10px}
  .head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .ref{font-family:'Oswald';font-weight:700;color:var(--royal);font-size:16px;flex:none}
  .title{font-weight:700;color:var(--ink);flex:1;min-width:170px}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:100px;color:#fff;flex:none}
  .open{background:#8C9299}.answered{background:var(--gold);color:#3a2c00}.done{background:var(--green)}.parked{background:#5B6472}
  .with{font-size:12.5px;color:#fff;background:var(--royal);padding:3px 10px;border-radius:100px;flex:none}
  .detail{margin-top:9px;font-size:14px;line-height:1.6}
  .reply{background:var(--wash);border-left:3px solid var(--royal);padding:9px 12px;margin-top:8px;font-size:14px;border-radius:0 6px 6px 0}
  .reply b{color:var(--ink)}
  .reply small{color:#7A8AA5;font-size:11.5px;display:block;margin-top:3px}
  .answer{display:none;margin-top:10px}
  .answer textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;font:inherit;min-height:80px}
  .namesel{padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
  .answer button{background:var(--green);color:#fff;border:0;border-radius:8px;padding:10px 20px;font:600 13px 'Oswald';text-transform:uppercase;letter-spacing:.05em;cursor:pointer;margin-top:8px}
  .link{background:none;border:0;color:var(--royal);font:600 13px 'Montserrat';cursor:pointer;padding:0;text-decoration:underline;margin-top:10px;display:inline-block}
  .status{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .status em{font-size:12px;color:#7A8AA5;font-style:normal;margin-right:2px}
  .status button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 11px;font-size:11.5px;cursor:pointer;color:var(--body)}
  .status button:hover{border-color:var(--royal);color:var(--royal)}
  #msg{padding:30px;text-align:center;color:#7A8AA5}
  footer{text-align:center;color:#7A8AA5;font-size:12.5px;padding:24px}
</style>
</head>
<body>
<div class="top"><h1>Website — decisions and tasks</h1><small>Everything raised so far. Anyone can answer anything &mdash; it saves for everyone to see.</small></div>
<div class="wrap">
  <p id="counts" style="font-size:13.5px;color:#7A8AA5;margin-bottom:14px"></p>
  <div id="msg">Loading…</div>
  <div id="content" style="display:none">
    <div class="filters">
      <button class="on" data-f="all" onclick="setFilter(this)">Everything</button>
      <button data-f="open" onclick="setFilter(this)">Still open</button>
      <button data-f="answered" onclick="setFilter(this)">Answered</button>
      <button data-f="done" onclick="setFilter(this)">Done</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<footer>Dale Supporters Trust &middot; board use</footer>
<script>
const EP='https://join.daletrust.uk';
const KEY='TASKS_KEY_FOR_DALE';
const $=id=>document.getElementById(id);
let tasks=[], filter='all', who='';
const NAMES=['— your name —','Emma Loynd','Scott Goulding','Murray Knight','Vince Ashall','Michael Shepherd',
  'Chris Culshaw','Ian Goodwin','Keith Hicks','Siobhan McElhinney','Ruby Loynd','Matt Cullen','Kirsty Fernehough'];
try{who=localStorage.getItem('dt_who')||'';}catch(e){}
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function setFilter(b){document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;draw();}

async function load(){
  try{
    const d=await (await fetch(EP+'/tasks?key='+encodeURIComponent(KEY))).json();
    if(!d.ok){$('msg').textContent=d.error||'Could not load the list.';return;}
    tasks=d.tasks;
    const open=tasks.filter(t=>t.status==='open').length, done=tasks.filter(t=>t.status==='done').length;
    $('counts').textContent=tasks.length+' items \u00b7 '+open+' still open \u00b7 '+done+' done';
    $('msg').style.display='none';$('content').style.display='block';
    draw();
  }catch(e){$('msg').textContent='Could not reach the server — please try again.';}
}

function draw(){
  const list = filter==='all' ? tasks : tasks.filter(t=>t.status===filter);
  if(!list.length){$('list').innerHTML='<p style="padding:20px;color:#7A8AA5">Nothing here.</p>';return;}
  let html='',section='';
  list.forEach(t=>{
    if(t.section!==section){section=t.section;html+='<h2 class="sec">'+esc(section)+'</h2>';}
    html+='<div class="item">'+
      '<div class="head"><span class="ref">'+esc(t.ref)+'</span>'+
      '<span class="title">'+esc(t.title)+'</span>'+
      (t.owner?'<span class="with">'+esc(t.owner)+'</span>':'')+
      '<span class="pill '+t.status+'">'+t.status+'</span></div>'+
      (t.detail?'<div class="detail">'+esc(t.detail)+'</div>':'')+
      t.responses.map(r=>'<div class="reply"><b>'+esc(r.author)+':</b> '+esc(r.body)+
        '<small>'+new Date(r.at.replace(' ','T')+'Z').toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</small></div>').join('')+
      '<button class="link" onclick="toggle('+t.id+')">'+(t.responses.length?'Add a comment':'Answer this')+'</button>'+
      '<div class="answer" id="a'+t.id+'"><textarea id="t'+t.id+'" placeholder="Type your answer…"></textarea>'+
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px">'+
      '<select id="w'+t.id+'" class="namesel">'+NAMES.map(n=>'<option'+(n===who?' selected':'')+'>'+n+'</option>').join('')+'</select>'+
      '<button onclick="send('+t.id+')">Save</button></div></div>'+
      '<div class="status"><em>Mark as:</em>'+['open','answered','done','parked'].map(s=>
        '<button onclick="setStatus('+t.id+',&quot;'+s+'&quot;)">'+s+'</button>').join('')+'</div>'+
      '</div>';
  });
  $('list').innerHTML=html;
}

function toggle(id){const el=$('a'+id);el.style.display=el.style.display==='block'?'none':'block';if(el.style.display==='block')$('t'+id).focus();}

async function send(id){
  const name=$('w'+id).value;
  if(name.indexOf('—')===0){alert('Please choose your name next to the Save button.');return;}
  who=name; try{localStorage.setItem('dt_who',who);}catch(e){}
  const body=$('t'+id).value.trim(); if(!body)return;
  const d=await (await fetch(EP+'/tasks/respond?key='+encodeURIComponent(KEY),{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:id,body,author:name})})).json();
  if(d.ok) load(); else alert(d.error||'Could not save.');
}
async function setStatus(id,status){
  const d=await (await fetch(EP+'/tasks/status?key='+encodeURIComponent(KEY),{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:id,status,author:who})})).json();
  if(d.ok) load();
}
load();
</script>
</body>
</html>
